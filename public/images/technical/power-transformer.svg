<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Power transformer, conceptual technical schematic, not to scale">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#dfe9f0" stroke-width="1"/></pattern>
    <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#f5f9fc"/><stop offset="1" stop-color="#dae7ef"/></linearGradient>
    <style>
      .ink{stroke:#214763;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .fine{stroke:#4c718a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .part{fill:url(#steel);stroke:#214763;stroke-width:4;stroke-linejoin:round}
      .warm{fill:#fff0dc;stroke:#b96b19;stroke-width:3}
      .call{stroke:#ed962d;stroke-width:2.5;fill:none;stroke-linecap:round}
      .dot{fill:#ed962d}
      .label{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#214763}
      .small{font-family:Arial,sans-serif;font-size:17px;fill:#5e7385}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7fafc"/>
  <rect x="42" y="143" width="1116" height="523" rx="20" fill="#fff" stroke="#d7e3eb" stroke-width="2"/>
  <rect x="58" y="159" width="1084" height="491" rx="12" fill="url(#grid)"/>
  <text x="62" y="59" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed962d">WENZE  /  TECHNICAL REFERENCE 04</text>
  <text x="62" y="111" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17324e">Power transformer</text>
